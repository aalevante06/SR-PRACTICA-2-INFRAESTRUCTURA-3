# FG-2174 — configuración funcional depurada para documentación pública
# FortiOS 7.0.9 / FortiGate-VM64-KVM
# Secretos reales, contraseñas y material criptográfico no se publican.
# Este archivo es un extracto documental; no sustituye un backup de restauración.

config system interface
    edit "port1"
        set ip 21.74.3.2 255.255.255.252
        set allowaccess ping
        set alias "WAN-ISP"
        set role wan
    next
    edit "port2"
        set type physical
    next
    edit "port3"
        set ip 192.168.79.99 255.255.255.0
        set allowaccess ping https http
        set type physical
    next
    edit "VLAN10-USERS"
        set ip 10.21.74.1 255.255.255.128
        set allowaccess ping
        set role lan
        set interface "port2"
        set vlanid 10
    next
    edit "VPN-REMOTE-2174"
        set type tunnel
        set interface "port3"
    next
end

config system dhcp server
    edit 2
        set default-gateway 10.21.74.1
        set netmask 255.255.255.128
        set interface "VLAN10-USERS"
        config ip-range
            edit 1
                set start-ip 10.21.74.10
                set end-ip 10.21.74.100
            next
        end
        set dns-server1 8.8.8.8
        set dns-server2 1.1.1.1
    next
end

config firewall address
    edit "VLAN10-USERS address"
        set type interface-subnet
        set subnet 10.21.74.1 255.255.255.128
        set interface "VLAN10-USERS"
    next
    edit "WEB-SV-2174"
        set subnet 10.21.74.130 255.255.255.255
    next
    edit "VPN-REMOTE-2174_range"
        set type iprange
        set start-ip 10.212.135.10
        set end-ip 10.212.135.20
    next
end

config firewall addrgrp
    edit "VPN-REMOTE-2174_split"
        set member "WEB-SV-2174"
    next
end

config user local
    edit "vpn2174"
        set type password
        set passwd "<REDACTED>"
    next
end

config user group
    edit "SSLVPN-USER-2174"
        set member "vpn2174"
    next
end

# SSL-VPN quedó deshabilitado; la solución final utiliza IPsec Remote Access.
config vpn ssl settings
    set status disable
end

config vpn ipsec phase1-interface
    edit "VPN-REMOTE-2174"
        set type dynamic
        set interface "port3"
        set mode aggressive
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set dhgrp 5
        set xauthtype auto
        set authusrgrp "SSLVPN-USER-2174"
        set nattraversal forced
        set ipv4-start-ip 10.212.135.10
        set ipv4-end-ip 10.212.135.20
        set ipv4-netmask 255.255.255.0
        set dns-mode auto
        set ipv4-split-include "VPN-REMOTE-2174_split"
        set save-password enable
        set psksecret "<REDACTED>"
    next
end

config vpn ipsec phase2-interface
    edit "VPN-REMOTE-2174"
        set phase1name "VPN-REMOTE-2174"
        set proposal des-md5 des-sha1
        set dhgrp 5
    next
end

config firewall policy
    edit 3
        set name "DENY-DIRECT-SSH-WEB"
        set srcintf "VLAN10-USERS"
        set dstintf "port1"
        set srcaddr "VLAN10-USERS address"
        set dstaddr "WEB-SV-2174"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 1
        set name "USER-TO-INTERNET"
        set srcintf "VLAN10-USERS"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 4
        set name "vpn_VPN-REMOTE-2174_remote_0"
        set srcintf "VPN-REMOTE-2174"
        set dstintf "port1"
        set action accept
        set srcaddr "VPN-REMOTE-2174_range"
        set dstaddr "WEB-SV-2174"
        set schedule "always"
        set service "SSH"
        set logtraffic all
        set nat enable
    next
end

config router static
    edit 1
        set gateway 21.74.3.1
        set device "port1"
    next
end
